// الملف: android/build.gradle

buildscript {
    ext.kotlin_version =  1.9.20  // أو الإصدار المتوافق مع مشروعك
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // إذا كان مشروعك يستخدم نظام المكونات الإضافية القديم
        classpath  com.android.tools.build:gradle:8.2.1 
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir =  ../build 
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn( :app )
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// ====================================================================
// الكود الإجباري لتخطي خطأ الـ compileSdk 36 على الهاتف تلقائياً
// ====================================================================
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty( android )) {
            project.android {
                compileSdk = 36
                
                if (project.android.hasProperty( compileSdkVersion )) {
                    compileSdkVersion = 36
                }
                
                // إجبار المكونات الإضافية على التوافق مع أدوات البناء الحديثة
                defaultConfig {
                    if (project.android.defaultConfig.hasProperty( targetSdkVersion )) {
                        targetSdkVersion = 36
                    }
                }
            }
        }
    }
}
