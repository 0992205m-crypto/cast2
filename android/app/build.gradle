plugins {
    id "com.android.application"
    id "kotlin-android"
    // قد تجد أسطر إضافية هنا مثل id "dev.flutter.flutter-gradle-plugin" اتركها كما هي
}

android {
    // تم التعديل هنا مباشرة إلى إصدار 36 لحل مشكلة التوافق
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        // اسم الحزمة الخاص بتطبيقك (اترك الخاص بك كما هو)
        applicationId "com.example.cast2" 
        
        // جلب الإعدادات الافتراضية من فلاتر
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // إعدادات التوقيع الخاصة بتطبيقك
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
