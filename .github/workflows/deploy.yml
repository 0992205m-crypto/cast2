name: Flutter Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من مستودع جيتهاب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد جافا 17
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت بيئة فلاتر المستقرة
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. إصلاح نظام أندرويد لـ V2 بشكل نظيف وبدون تخريب للملفات
    - name: Clean and Setup Environment
      run: |
        echo "Cleaning previous build cache..."
        flutter clean
        
        echo "Fetching modern dependencies..."
        flutter pub get

    # 5. بناء ملف الـ APK (تم إزالة خيار --no-pub لضمان معالجة المكتبات تلقائياً)
    - name: Build APK Release
      run: flutter build apk --release --ignore-deprecation --no-tree-shake-icons --no-track-widget-creation

    # 6. رفع ملف الـ APK النهائي للتحميل
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
