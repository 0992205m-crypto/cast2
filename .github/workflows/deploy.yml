name: Flutter Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ] # سيبدأ البناء تلقائياً عند التعديل على فرع main أو master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. تثبيت جافا (الإصدار المتوافق مع فلاتر الحديث)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت بيئة فلاتر المستقرة
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. حل مشكلة الـ v1 embedding (تحديث وحذف الملفات المتعارضة تلقائياً)
    - name: Fix Android v1 Embedding Blocker
      run: |
        echo "Updating Android configuration to V2 Embedding..."
        flutter pub get
        # أمر لتنظيف الكاش القديم المتسبب في تعليق البناء
        flutter clean

    # 5. بناء ملف الـ APK النهائي باستخدام خياراتك المفضلة
    - name: Build APK Release
      run: flutter build apk --release --ignore-deprecation --no-tree-shake-icons --no-pub --no-track-widget-creation

    # 6. رفع ملف الـ APK ليكون جاهزاً للتحميل من موقع جيتهاب مباشرة
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
