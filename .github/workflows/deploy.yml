name: Ultimate Flutter Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من مستودع جيتهاب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد جافا 17 القياسية
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت بيئة فلاتر المستقرة
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. تدمير المجلد القديم وبناء قالب أندرويد حديث ونظيف تماماً
    - name: Recreate Android Project Configuration
      run: |
        echo "Deleting old android folder..."
        rm -rf android/
        
        echo "Creating fresh, modern Android build environment..."
        flutter create --platforms=android .

    # 5. تحميل الحزم وإصلاح كود المكتبة التالفة برمجياً في الـ Cache
    - name: Fetch Packages & Hotfix InAppWebView Code
      run: |
        echo "Running full system clean..."
        flutter clean
        
        echo "Downloading packages..."
        flutter pub get
        
        echo "Injecting Hotfix directly into flutter_inappwebview_android source code..."
        # هذا الأمر يبحث عن ملف build.gradle الخاص بالمكتبة التالفة ويقوم باستبدال السطر القديم بالحديث فوراً
        TARGET_FILE="/home/runner/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
        if [ -f "$TARGET_FILE" ]; then
          sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' "$TARGET_FILE"
          echo "Hotfix applied successfully to $TARGET_FILE!"
        else
          echo "Warning: Target file not found, looking in alternative paths..."
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} + || true
        fi

    # 6. بناء ملف الـ APK النهائي بنجاح تام بعد الإصلاح الجراحي للكود
    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    # 7. رفع ملف الـ APK النهائي ليكون جاهزاً للتحميل فوراً
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
