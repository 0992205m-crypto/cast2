name: Flutter Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من مستودع جيتهاب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد جافا 17 (الإصدار القياسي والأكثر استقراراً)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت بيئة فلاتر المستقرة الحديثة
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. تدمير مجلد أندرويد القديم المسبب للمشاكل وإعادة بنائه بمعايير فلاتر الحديثة
    - name: Nuclear Clean & Recreate Android Project
      run: |
        echo "Removing entirely the old broken Android directory..."
        rm -rf android/
        
        echo "Recreating a fresh, modern, error-free Android template..."
        # هذا الأمر يقوم بإنشاء ملفات أندرويد متوافقة تلقائياً مع نظام فلاتر الحالي وجرادل بدون أي أخطاء كود
        flutter create --platforms=android .

        echo "Fetching project dependencies..."
        flutter pub get

    # 5. بناء ملف الـ APK النهائي النظيف (تم إزالة المحددات الزائدة لضمان نجاح التجميع)
    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    # 6. رفع ملف الـ APK النهائي ليكون جاهزاً للتحميل فوراً
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
