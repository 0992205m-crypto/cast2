name: Ultimate Flutter Build and Deploy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من مستودع جيتهاب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد جافا 17 القياسية
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت أحدث بيئة فلاتر مستقرة (Stable) متوفرة الآن
    - name: Set up Flutter (Latest Stable)
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. تدمير المجلد القديم وبناء قالب أندرويد حديث ونظيف تماماً
    - name: Recreate Android Project Configuration
      run: |
        echo "Deleting old android folder..."
        rm -rf android/
        
        echo "Creating fresh, modern Android build environment..."
        flutter create --platforms=android .

    # 5. التحديث الإجباري الشامل لكل مكتبات المشروع إلى أحدث إصدار متوفر
    - name: Upgrade All Project Dependencies To Latest Versions
      run: |
        echo "Running full system cache clean..."
        flutter clean
        
        echo "Upgrading all pubspec dependencies to the absolute latest major versions..."
        # هذا الأمر يقوم بتحديث كل حزم تطبيقك القديمة وتعديلها تلقائياً لأحدث إصدار مستقر
        flutter pub upgrade --major-versions
        
        echo "Verifying and downloading the upgraded dependencies..."
        flutter pub get

    # 6. بناء ملف الـ APK النهائي بنجاح تام وبأعلى توافقية
    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    # 7. رفع ملف الـ APK النهائي ليكون جاهزاً للتحميل فوراً
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
