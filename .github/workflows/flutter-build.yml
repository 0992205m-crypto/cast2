  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version:  stable 

  - name: Decode keystore (if provided)
    if: ${{ secrets.KEYSTORE_BASE64 !=    }}
    run: |
      mkdir -p android/keystores
      echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystores/my-release-key.jks

  - name: Create key.properties (if keystore provided)
    if: ${{ secrets.KEYSTORE_BASE64 !=    }}
    run: |
      cat > android/key.properties <<EOF
      storePassword=${{ secrets.KEYSTORE_PASSWORD }}
      keyPassword=${{ secrets.KEY_PASSWORD }}
      keyAlias=${{ secrets.KEY_ALIAS }}
      storeFile=keystores/my-release-key.jks
      EOF

  - name: Install dependencies
    run: flutter pub get

  - name: Build appbundle (AAB)
    run: flutter build appbundle --release

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-release-aab
      path: build/app/outputs/bundle/release/app-release.aab
  
